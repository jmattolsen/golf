<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0a0a0a;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;
 overscroll-behavior-y:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font-family:inherit}
h1,h2,h3,.club,.num,.tabb,.big{font-family:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",-apple-system,sans-serif;
 text-transform:uppercase;font-weight:800;letter-spacing:.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 130px}
.tiny{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a;font-weight:800}
.muted{color:#8a8a8a}
.top{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.95);backdrop-filter:blur(12px);
 border-bottom:2px solid #ea0000;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.toprow{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.toprow h1{margin:0;font-size:20px}
.toprow .r{margin-left:auto;font-size:12px;color:#8a8a8a;font-weight:700;text-align:right;line-height:1.3}

/* number display + pad */
.numbox{text-align:center;padding:18px 0 6px}
.numbox .lab{font-size:12px;letter-spacing:.14em;color:#8a8a8a;font-weight:800}
.numbox .val{font-size:82px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;
 font-family:"Avenir Next Condensed","Helvetica Neue",sans-serif}
.numbox .val span{font-size:26px;color:#8a8a8a;margin-left:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.pad button{padding:20px 0;border-radius:14px;background:#141414;border:1px solid #262626;font-size:26px;font-weight:700;
 font-variant-numeric:tabular-nums}
.pad button:active{background:#1e1e1e}
.pad button.act{color:#ea0000;font-size:20px}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{flex:1;min-width:64px;padding:13px 6px;border-radius:12px;background:#141414;border:1px solid #262626;
 font-size:15px;font-weight:700;text-align:center}
.chip.on{background:#ea0000;border-color:#ea0000}
.chip small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:2px}
.stepper{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.stepper button{flex:0 0 62px;background:#141414;border:1px solid #262626;border-radius:12px;font-size:26px;font-weight:300}
.stepper .v{flex:1;background:#141414;border:1px solid #262626;border-radius:12px;text-align:center;padding:13px 4px;
 font-size:19px;font-weight:700}
.stepper .v small{display:block;font-size:11px;color:#8a8a8a;font-weight:700;letter-spacing:.1em}

/* answer */
.ans{margin-top:18px;background:#141414;border:1px solid #262626;border-radius:18px;overflow:hidden}
.ans .head{padding:16px 18px;border-bottom:1px solid #262626;display:flex;align-items:baseline;gap:10px}
.ans .head .pl{font-size:13px;color:#8a8a8a;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.ans .head .plv{margin-left:auto;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;
 font-family:"Avenir Next Condensed","Helvetica Neue",sans-serif}
.ans .body{padding:20px 18px}
.club{font-size:52px;line-height:1;color:#ea0000}
.sub{margin-top:8px;font-size:16px;color:#d6d6d6}
.alts{display:flex;gap:10px;margin-top:16px}
.alt{flex:1;background:#0a0a0a;border:1px solid #262626;border-radius:12px;padding:12px;text-align:center}
.alt b{display:block;font-size:19px}
.alt span{font-size:12px;color:#8a8a8a}
.note{margin-top:16px;padding:14px 16px;background:rgba(234,0,0,.07);border-left:3px solid #ea0000;border-radius:0 10px 10px 0;
 font-size:16px;line-height:1.45;color:#d6d6d6}
.note b{color:#fff}
.warn{background:rgba(255,255,255,.05);border-left-color:#8a8a8a}

/* clubs */
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1c1c1c}
.crow .n{font-size:17px;font-weight:700;flex:1}
.crow input{width:86px;background:#141414;border:1px solid #262626;border-radius:10px;color:#fff;font-size:19px;
 text-align:center;padding:11px 4px;font-weight:700}
.crow .u{font-size:13px;color:#8a8a8a;width:26px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
th{font-size:11px;letter-spacing:.1em;color:#8a8a8a;text-align:right;padding:8px 4px;text-transform:uppercase}
th:first-child{text-align:left}
td{padding:11px 4px;border-top:1px solid #1c1c1c;text-align:right;font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font-weight:700}
ol{padding-left:20px;line-height:1.7;font-size:16px;color:#d6d6d6}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.kpi div{flex:1;min-width:120px;background:#141414;border:1px solid #262626;border-radius:14px;padding:14px}
.kpi b{display:block;font-size:22px;font-family:"Avenir Next Condensed","Helvetica Neue",sans-serif}
.kpi span{font-size:12px;color:#8a8a8a;letter-spacing:.06em;text-transform:uppercase;font-weight:700}


.chip.lie{flex:0 0 calc(50% - 4px);min-width:0;text-align:left;padding:12px 12px}
.chip.lie small{opacity:.6}
.lieblk{margin-top:12px;background:#141414;border:1px solid #262626;border-radius:16px;padding:16px 18px}
.lieh{font-family:"Avenir Next Condensed","Helvetica Neue",sans-serif;text-transform:uppercase;font-weight:800;
 font-size:21px;color:#ea0000;margin-bottom:6px}
.lsec{margin-top:12px}
.lsec span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a;font-weight:800}
.lsec p{margin:5px 0 0;font-size:16px;line-height:1.45;color:#d6d6d6}
.lsec ul{margin:6px 0 0;padding-left:18px}
.lsec li{font-size:16px;line-height:1.5;color:#d6d6d6;margin-bottom:4px}
.acc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 14px;margin-top:8px;
 background:#141414;border:1px solid #262626;border-radius:14px}
.acc .gg{flex:0 0 30px;height:30px;border-radius:8px;background:#ea0000;color:#fff;font-weight:800;font-size:14px;
 display:flex;align-items:center;justify-content:center}
.acc .nn{flex:1;font-size:17px;font-weight:700}
.acc .cv{color:#8a8a8a;font-size:22px}
.gradeRow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #1c1c1c;font-size:16px;
 line-height:1.45;color:#d6d6d6}
.gradeRow .g{flex:0 0 34px;height:34px;border-radius:9px;background:#ea0000;display:flex;align-items:center;
 justify-content:center;font-weight:800;font-family:"Avenir Next Condensed","Helvetica Neue",sans-serif;font-size:18px;color:#fff}
.tabb{font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,10,.97);backdrop-filter:blur(12px);
 border-top:1px solid #262626;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px)}
.tabrow{max-width:560px;margin:0 auto;display:flex;gap:8px}
.tabb{flex:1;padding:14px 0;border-radius:14px;font-size:14px;text-align:center;color:#8a8a8a}
.tabb.on{background:#ea0000;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= PLAYER PROFILE (from Arccos + coaching notes) ================= */
var DEF={
 clubs:[["Driver",276],["3 Wood",245],["5 Wood",228],["4 Iron",210],["5 Iron",197],["6 Iron",185],["7 Iron",172],
        ["8 Iron",159],["9 Iron",146],["PW",133],["GW",120],["SW",105],["LW",88]],
 disp:{"Driver":41,"3 Wood":34,"5 Wood":30,"4 Iron":26,"5 Iron":24,"6 Iron":22,"7 Iron":20,"8 Iron":18,"9 Iron":17,
       "PW":15,"GW":14,"SW":12,"LW":10}
};
var RULES=[
 "Widest part of the fairway. 275 in play beats 300 in trouble.",
 "No hero shots. Take the medicine, make bogey the worst score.",
 "125 to 175 is the scoring gap. Center of green until it is proven.",
 "Never short side yourself. Doubles live on the short side.",
 "Enough club. Most misses are short, especially into wind.",
 "Long putts are two putts. Lag it, tap it, walk."
];
var KPI=[["<35 yd","Driver dispersion"],["<0.5","Penalty drives / round"],["70%","Playable drives"],["12+","Greens in regulation"]];

/* ================= LIE LIBRARY ================= */
var LIES=[
 {id:"tee",n:"Teed Up",grade:"A",adj:1,aim:0,
  read:"Ball on a tee, nothing between the club and the ball.",
  setup:["Normal stance and ball position for the club.","Driver: ball off the lead heel, half the ball above the crown."],
  swing:["Trust the number. This is the only lie with no compromise."],
  expect:"Full carry, full spin, full control."},

 {id:"fairway",n:"Fairway",grade:"A",adj:1,aim:0,
  read:"Ball sitting on top of short grass. You can slide a card under it.",
  setup:["Normal setup. Irons: ball one ball forward of center.","Weight 55 percent lead side at address."],
  swing:["Ball first, turf after. Nothing fancy."],
  expect:"The number is the number. Attack it if the pin allows."},

 {id:"lightrough",n:"Light Rough, Sitting Up",grade:"B",adj:0.93,aim:0,
  read:"You can see the whole ball, it sits on top of the grass, and the grass leans toward the target. This is the flyer lie.",
  setup:["Hover the club just off the ground so you do not snag grass and move the ball.","Ball center. Grip a touch firmer.","Take LESS club than the number."],
  swing:["Sweep it. Do not chop down and add grass between the face and the ball.","Smooth speed, this lie does not need force."],
  expect:"Grass kills spin, so it launches higher and lands hot. Plan on 5 to 10 percent farther and a lot of release. Land it short of the flag every time."},

 {id:"deeprough",n:"Deep Rough, Ball Down",grade:"C",adj:1.18,aim:0,cap:"7 Iron",
  read:"You only see the top of the ball, or the grass is growing back at you. Push your hand into it: if the grass wraps the hosel, forget the green.",
  setup:["Ball back of center, weight 60 percent lead side.","Open the face slightly, the grass will close it through impact.","Choke down half an inch, firm up the grip pressure."],
  swing:["Steeper V shape, up and down, not around.","Accelerate through. The grass will slow the club more than you expect."],
  expect:"20 to 40 percent distance loss, no spin, low and running. Anything longer than a 7 iron rarely works. Advance it to a number you like and take your bogey."},

 {id:"divot",n:"Divot or Sandy Divot",grade:"B",adj:1.05,aim:0,
  read:"Ball below the level of the turf, sitting in an old divot or filled sand.",
  setup:["Ball one to two balls back of normal.","Hands ahead of the ball, weight 60 percent lead side.","One more club, choke down slightly."],
  swing:["Steeper. Hit down and through, drive the handle forward.","Do not try to help it up. Trust the loft."],
  expect:"Lower flight, less spin, big release. Land it 5 to 10 short and let it run."},

 {id:"hardpan",n:"Hardpan or Bare Dirt",grade:"B",adj:1,aim:0,
  read:"No grass under the ball, firm ground, sometimes gravel. Bounce is your enemy here.",
  setup:["Ball slightly back, hands ahead, weight forward.","Around the green use a lower bounce club, PW or GW instead of the 60."],
  swing:["Pick it clean, shallow, brush the ground.","Rotate the body through. Do not use the hands to lift it."],
  expect:"Lower launch, comes out hot, minimal spin. Near the green, putting or a bump and run is usually the higher percentage play."},

 {id:"fwbunker",n:"Fairway Bunker",grade:"B",adj:1.08,aim:0,
  read:"Check the LIP first, then the lie. If the lip eats the club you need, this is a layup, not a decision.",
  setup:["Feet barely dug in, just enough to be stable.","Choke down half an inch to offset sinking in.","Ball center. Weight even. One to two more clubs."],
  swing:["Quiet lower body, 80 percent speed.","Ball first, sand after. Keep your height, do not drop into it."],
  expect:"Clean contact is the whole shot. The extra club covers the choke down and the easy swing."},

 {id:"sand",n:"Greenside Bunker, Clean Lie",grade:"B",adj:1,aim:0,force:"SW",
  read:"Ball sitting on top of soft sand, no crater around it.",
  setup:["Open the stance and the face, then take your grip.","Dig the feet in an inch, ball forward of center, weight 55 percent lead.","Grip down to match the depth you dug in."],
  swing:["Enter about two inches behind the ball and splash the sand out.","Speed comes from the length of the swing. Accelerate and finish, never quit."],
  expect:"High and soft with little spin. Take the middle of the green unless the pin is on the fat side."},

 {id:"plugged",n:"Plugged or Fried Egg",grade:"D",adj:1,aim:0,force:"SW",
  read:"Crater around the ball, half or more of it buried.",
  setup:["Square the face, or even close it slightly, so the leading edge digs.","Ball center to back, weight forward, feet firm."],
  swing:["Steep. Drive the leading edge into the sand just behind the ball.","Little to no follow through. Bury the club."],
  expect:"It comes out low with no spin and runs. Take the front half of the green and be happy. Never aim at a short side pin from here."},

 {id:"wetsand",n:"Wet or Packed Sand",grade:"B",adj:1,aim:0,force:"GW",
  read:"Sand is firm, your feet barely leave a print, the rake leaves smooth lines.",
  setup:["Less bounce, PW or GW instead of the 60.","Square the face more than normal, ball center."],
  swing:["Shallower entry, take much less sand, closer to the ball."],
  expect:"Comes out hot and low. Wet sand gives you no cushion, so soften the speed."},

 {id:"straw",n:"Pine Straw or Leaves",grade:"C",adj:1.03,aim:0,
  read:"Loose stuff under and around the ball. It often sits down further than it looks.",
  setup:["You may move loose impediments, but if the ball moves it costs you a stroke. Barely touch anything.","Do not ground the club hard behind the ball. Hover it.","Ball center, minimal foot shuffling."],
  swing:["Sweep it, pick it clean. Steep is how you catch straw first."],
  expect:"Unpredictable spin, usually a runner. Get it back to the short grass, that is the whole job."},

 {id:"wet",n:"Wet Grass or Mud on the Ball",grade:"C",adj:1.04,aim:0,
  read:"Water squeezes out around your shoes, or there is mud stuck to the ball. Check for free relief from casual water first.",
  setup:["Ball slightly back, hands forward, priority is clean contact.","One more club, the wet grass grabs the hosel."],
  swing:["Steeper, no dragging the bounce through wet turf."],
  expect:"A mud ball usually curves away from the side the mud is on, but it is a coin flip. Aim at the fat side of the green, expect less spin, and do not take on any trouble."},

 {id:"collar",n:"Against the Collar or Fringe",grade:"B",adj:1,aim:0,
  read:"Ball nestled against the first cut, no room to slide a wedge under it.",
  setup:["Putter is the first answer. Take the fringe out of the equation.","Or belly a wedge: choke down, leading edge at the equator of the ball, putting stroke."],
  swing:["Rock the shoulders. No wrists. Hit the middle of the ball."],
  expect:"It rolls like a putt. Boring beats brilliant here."},

 {id:"trees",n:"Trees, Punch Out",grade:"D",adj:1,aim:0,cap:"6 Iron",
  read:"Pick the widest exit, not the smallest window. Take a knee and look at what actually gets you back in play.",
  setup:["Narrow stance, ball back, choke down two inches, weight forward 70 percent.","Aim at the biggest gap, not the flag."],
  swing:["Half back, half through. Hold the finish low and short.","Take one or two extra clubs since it comes out low."],
  expect:"A low runner back to the fairway. Your own rule: no hero shots, bogey is the worst score."}
];

var SLOPES=[
 {id:"flat",n:"Flat",adj:1,aimPct:0,short:"Nothing to correct."},
 {id:"uphill",n:"Uphill",adj:1.08,aimPct:0.02,
  short:"Ball above the target line, lead foot high.",
  setup:["Set your shoulders parallel to the slope, not to the ground.","Weight favors the low foot, ball forward of center.","One more club, more on a steep slope."],
  swing:["Swing up the hill with the slope. Do not fight it.","Expect a short finish, you are swinging into a hill."],
  expect:"Higher and shorter, with a pull or draw. Aim right of your target."},
 {id:"downhill",n:"Downhill",adj:0.95,aimPct:-0.02,
  short:"Lead foot low. The hardest lie in golf.",
  setup:["Shoulders match the slope, weight on the lead foot and keep it there.","Ball back of center. Take one MORE loft, a shorter club, the slope delofts it."],
  swing:["Chase the clubhead down the slope. Do not hang back trying to lift it.","Balance over power, 3/4 speed."],
  expect:"Low, hot, and it runs. Miss tends right. Take the safe side of the green."},
 {id:"above",n:"Ball Above Feet",adj:1.03,aimPct:0.045,
  short:"Ball sits above your shoelaces.",
  setup:["Choke down an inch or more, stand slightly taller.","Weight into the balls of the feet, the slope wants to pull you back.","Aim right. This one goes left."],
  swing:["Flatter, rounder, 3/4 speed. Balance first, distance second."],
  expect:"Pull or hook. Roughly 5 to 8 yards left per 150 yards on a moderate slope, double it if it is steep."},
 {id:"below",n:"Ball Below Feet",adj:1.04,aimPct:-0.045,
  short:"Ball sits below your feet.",
  setup:["More knee flex, sit down into it, weight in the heels.","Full length grip, ball center, wider stance for balance.","Aim left. This one goes right."],
  swing:["Stay down through impact, the number one miss here is standing up and thinning it.","Quiet legs, 3/4 speed."],
  expect:"Push or fade, thin risk. Take one more club because you are swinging easier."}
];

var GRADES=[
 ["A","Clean contact, no interference, level stance. Attack the number and the pin if there is room."],
 ["B","Something is between the club and the ball, or a mild slope. Center of the green, one more club, no short siding."],
 ["C","Contact is compromised or the stance is awkward. Advance it to a number you like. Green is a bonus, not a plan."],
 ["D","Escape only. Wedge it back to the short grass, take bogey, move to the next tee."]
];
var READ5=[
 "Can I get the face on the back of the ball cleanly?",
 "What is between the club and the ball, and which way is the grass growing?",
 "Is the ball sitting up, level, or down in it?",
 "What is my footing, and how much swing can I keep balance through?",
 "How much loft do I need to clear the lip, branch, or hill in front of me?",
 "If this comes out badly, where does it go, and is that place OK?"
];

/* ================= STORAGE ================= */
var KEY="caddie-v1",mem={};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return mem}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){mem=o}}
var DB=load();
if(!DB.clubs){DB.clubs={};DEF.clubs.forEach(function(c){DB.clubs[c[0]]=c[1]});save(DB)}
if(DB.temp===undefined){DB.temp=90}

/* ================= STATE ================= */
var S={tab:"shot",yds:"",wind:0,wdir:"none",elev:0,lie:"fairway",slope:"flat",pin:"center",
       hole:"",trouble:"none",width:"normal",openLie:null};
var app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function clubList(){var a=[];DEF.clubs.forEach(function(c){var v=parseFloat(DB.clubs[c[0]]);if(!isNaN(v)&&v>0)a.push([c[0],v])});
 a.sort(function(x,y){return y[1]-x[1]});return a}
function dispOf(n){return DEF.disp[n]||20}
function lieOf(id){for(var i=0;i<LIES.length;i++)if(LIES[i].id===id)return LIES[i];return LIES[1]}
function slopeOf(id){for(var i=0;i<SLOPES.length;i++)if(SLOPES[i].id===id)return SLOPES[i];return SLOPES[0]}


/* ================= MATH ================= */
function playsLike(){
 var d=parseFloat(S.yds);if(isNaN(d)||d<=0)return null;
 var L=lieOf(S.lie),SL=slopeOf(S.slope);
 var p=d;
 p+=S.elev;
 var f=d/150;
 if(S.wdir==="into"){p+=S.wind*f*1.2}
 else if(S.wdir==="down"){p-=S.wind*f*0.6}
 p*= 1+((70-DB.temp)*0.001);
 p*= L.adj;
 p*= SL.adj;
 var drift=0,dir="";
 if(S.wdir==="lr"||S.wdir==="rl"){drift=Math.round(S.wind*f*0.8);dir=(S.wdir==="lr")?"left":"right"}
 var slopeAim=Math.round(d*Math.abs(SL.aimPct));
 var slopeDir=SL.aimPct>0?"right":SL.aimPct<0?"left":"";
 return {raw:d,plays:Math.round(p),drift:drift,driftDir:dir,slopeAim:slopeAim,slopeDir:slopeDir,lie:L,slope:SL};
}
function pickClub(target){
 var cl=clubList(),pick=null,under=null;
 for(var i=cl.length-1;i>=0;i--){ if(cl[i][1]>=target){pick=cl[i];break} }
 for(var i=0;i<cl.length;i++){ if(cl[i][1]<target){under=cl[i];break} }
 if(!pick)return{main:cl[0],more:null,less:cl[1]||null,short:true};
 var idx=cl.indexOf(pick);
 return {main:pick,more:idx>0?cl[idx-1]:null,less:idx<cl.length-1?cl[idx+1]:null,short:false};
}
function applyLie(p,L,plays){
 var cl=clubList(),find=function(n){for(var i=0;i<cl.length;i++)if(cl[i][0]===n)return cl[i];return null};
 if(L.force){var f=find(L.force);if(f&&plays<=f[1]+15){p.main=f;p.forced=true;p.more=null;p.less=find("LW")||p.less}}
 if(L.cap){var c=find(L.cap);if(c&&p.main[1]>c[1]){p.main=c;p.capped=true;
   var i=cl.indexOf(c);p.more=null;p.less=i<cl.length-1?cl[i+1]:null}}
 return p;
}
function advice(r,p){
 var out=[],L=r.lie,SL=r.slope;
 if(p.short)out.push("<b>This is more than you have.</b> Lay up to a full wedge number instead of chasing it.");
 if(p.capped)out.push("<b>That number is not available from this lie.</b> Longer clubs do not escape it. Take the "
  +esc(p.main[0])+", advance it, and play the next one from the short grass.");
 if(p.forced)out.push("<b>This is a technique shot, not a number.</b> Splash it out to the middle of the green and take your two putts.");
 out.push("<b>"+esc(L.n)+" ("+L.grade+" lie).</b> "+esc(L.expect));
 if(SL.id!=="flat")out.push("<b>"+esc(SL.n)+".</b> "+esc(SL.expect));
 if(r.slopeAim>0)out.push("Slope aim: start it about <b>"+r.slopeAim+" yards "+r.slopeDir+"</b> of the flag.");
 if(r.drift>0)out.push("Crosswind: start it about <b>"+r.drift+" yards</b> into the wind.");
 if(L.grade==="D")out.push("<b>D lie.</b> Escape only. Wedge it back to the short grass and take bogey.");
 else if(L.grade==="C")out.push("<b>C lie.</b> Advance it to a number you like. The green is a bonus, not the plan.");
 else if(S.pin==="tucked")out.push("<b>Do not short side it.</b> Aim at the fat side. Doubles come from short side chips.");
 if(L.grade==="A"||L.grade==="B"){
  if(r.plays>=175)out.push("Center of the green. This is a two putt zone, take par and move on.");
  else if(r.plays>=125)out.push("Your scoring gap. Center of green unless the pin sits on the fat side.");
  else out.push("Green light if there is room. Land it pin high and miss on the fat side.");
 }
 if(S.wdir==="into"&&S.wind>=10)out.push("Into the wind, swing easier with more club. Speed adds spin and balloons it.");
 return out;
}
/* ================= SHOT TAB ================= */
function shotView(){
 var r=playsLike(),p=r?applyLie(pickClub(r.plays),r.lie,r.plays):null;
 var h='<div class="wrap"><div class="numbox"><div class="lab">Yards to pin</div>'
  +'<div class="val">'+(S.yds||"0")+'<span>yd</span></div></div><div class="pad">';
 [1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button onclick="dig('+n+')">'+n+'</button>'});
 h+='<button class="act" onclick="clr()">CLR</button><button onclick="dig(0)">0</button>'
  +'<button class="act" onclick="del()">DEL</button></div>';

 h+='<div class="tiny" style="margin-top:22px">Wind</div><div class="row">'
  +chip("none","Calm","wdir")+chip("into","Into","wdir")+chip("down","Down","wdir")
  +chip("lr","L to R","wdir")+chip("rl","R to L","wdir")+'</div>';
 if(S.wdir!=="none"){
  h+='<div class="stepper"><button onclick="bump(\'wind\',-5)">&minus;</button>'
   +'<div class="v">'+S.wind+' mph<small>wind speed</small></div>'
   +'<button onclick="bump(\'wind\',5)">+</button></div>';
 }
 h+='<div class="tiny" style="margin-top:20px">Elevation</div>'
  +'<div class="stepper"><button onclick="bump(\'elev\',-5)">&minus;</button>'
  +'<div class="v">'+(S.elev>0?"+":"")+S.elev+' yd<small>'+(S.elev>0?"uphill":S.elev<0?"downhill":"flat")+'</small></div>'
  +'<button onclick="bump(\'elev\',5)">+</button></div>';
 h+='<div class="tiny" style="margin-top:20px">Lie <span style="color:#ea0000">&middot; tap for how to play it</span></div><div class="row">';
 LIES.forEach(function(L){
  h+='<button class="chip lie'+(S.lie===L.id?' on':'')+'" onclick="setLie(\''+L.id+'\')">'+esc(L.n)
   +'<small>'+L.grade+' lie</small></button>';
 });
 h+='</div>';
 h+='<div class="tiny" style="margin-top:20px">Stance / slope</div><div class="row">';
 SLOPES.forEach(function(L){
  h+='<button class="chip'+(S.slope===L.id?' on':'')+'" onclick="setK(\'slope\',\''+L.id+'\')">'+esc(L.n)+'</button>';
 });
 h+='</div>';
 h+='<div class="tiny" style="margin-top:20px">Pin</div><div class="row">'
  +chip("center","Middle","pin")+chip("tucked","Tucked","pin")+'</div>';

 if(r&&p){
  h+='<div class="ans"><div class="head"><span class="pl">Plays like</span>'
   +'<span class="plv">'+r.plays+' yd</span></div><div class="body">'
   +'<div class="club">'+esc(p.main[0])+'</div>'
   +'<div class="sub">'+(p.forced?'Technique shot. Sand first, accelerate through.':
   p.capped?'As much as this lie gives you. Get it back in play.':
   p.main[1]+' yard club '+(p.main[1]-r.plays>=0?'('+(p.main[1]-r.plays)+' to spare)':''))+'</div>'
   +'<div class="alts">'
   +(p.more?'<div class="alt"><b>'+esc(p.more[0])+'</b><span>if between clubs</span></div>':'')
   +(p.less?'<div class="alt"><b>'+esc(p.less[0])+'</b><span>if flushed / downwind</span></div>':'')
   +'</div>';
  advice(r,p).forEach(function(t){h+='<div class="note">'+t+'</div>'});
  h+='</div></div>';
  h+=howTo(lieOf(S.lie),slopeOf(S.slope));
 } else {
  h+='<div class="ans"><div class="body muted" style="font-size:17px">Punch in the number and it will tell you the club.</div></div>';
 }
 h+='</div>';
 return h;
}
function chip(v,label,key){return '<button class="chip'+(S[key]===v?' on':'')+'" onclick="setK(\''+key+'\',\''+v+'\')">'+label+'</button>'}
function setLie(id){S.lie=id;render()}
function setK(k,v){S[k]=v;if(k==="wdir"&&v==="none")S.wind=0;if(k==="wdir"&&S.wind===0&&v!=="none")S.wind=10;render()}
function bump(k,d){S[k]=Math.max(k==="wind"?0:-60,S[k]+d);render()}
function dig(n){if(S.yds.length<3)S.yds+=String(n);render()}
function del(){S.yds=S.yds.slice(0,-1);render()}
function clr(){S.yds="";render()}


function block(title,o){
 if(!o)return "";
 var h='<div class="lieblk"><div class="lieh">'+esc(title)+'</div>';
 if(o.read)h+='<div class="lsec"><span>Read it</span><p>'+esc(o.read)+'</p></div>';
 if(o.short&&!o.read)h+='<div class="lsec"><span>Read it</span><p>'+esc(o.short)+'</p></div>';
 if(o.setup&&o.setup.length){h+='<div class="lsec"><span>Set up</span><ul>';
  o.setup.forEach(function(t){h+='<li>'+esc(t)+'</li>'});h+='</ul></div>'}
 if(o.swing&&o.swing.length){h+='<div class="lsec"><span>Swing</span><ul>';
  o.swing.forEach(function(t){h+='<li>'+esc(t)+'</li>'});h+='</ul></div>'}
 if(o.expect)h+='<div class="lsec"><span>Expect</span><p>'+esc(o.expect)+'</p></div>';
 return h+'</div>';
}
function howTo(L,SL){
 var h='<div class="section" style="margin-top:22px"><div class="tiny">How to play it</div>';
 h+=block(L.n+"  ("+L.grade+" lie)",L);
 if(SL.id!=="flat")h+=block(SL.n,SL);
 return h+'</div>';
}
/* ================= TEE TAB ================= */
function teeView(){
 var cl=clubList(),hole=parseFloat(S.hole),rec=null,rows="";
 var widthYd={tight:32,normal:44,wide:58}[S.width];
 if(S.trouble==="both")widthYd-=8; else if(S.trouble!=="none")widthYd-=4;
 for(var i=0;i<cl.length;i++){
  var c=cl[i],d=dispOf(c[0]),fits=d<=widthYd;
  var left=hole?Math.max(0,Math.round(hole-c[1])):null;
  if(!rec&&fits)rec=c;
  if(i<5)rows+='<tr><td>'+esc(c[0])+'</td><td>'+c[1]+'</td><td style="color:'+(fits?"#ea0000":"#8a8a8a")+'">'+d+' yd</td>'
   +'<td>'+(left!==null?left:"—")+'</td></tr>';
 }
 if(!rec)rec=cl[cl.length-1];
 var leaves=hole?Math.max(0,Math.round(hole-rec[1])):null;
 var h='<div class="wrap"><div class="numbox"><div class="lab">Hole yardage</div>'
  +'<div class="val">'+(S.hole||"0")+'<span>yd</span></div></div><div class="pad">';
 [1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button onclick="tdig('+n+')">'+n+'</button>'});
 h+='<button class="act" onclick="S.hole=\'\';render()">CLR</button><button onclick="tdig(0)">0</button>'
  +'<button class="act" onclick="S.hole=S.hole.slice(0,-1);render()">DEL</button></div>';
 h+='<div class="tiny" style="margin-top:22px">Fairway width</div><div class="row">'
  +chip("tight","Tight","width")+chip("normal","Normal","width")+chip("wide","Wide","width")+'</div>';
 h+='<div class="tiny" style="margin-top:20px">Trouble</div><div class="row">'
  +chip("none","None","trouble")+chip("left","Left","trouble")+chip("right","Right","trouble")+chip("both","Both","trouble")+'</div>';
 h+='<div class="ans"><div class="head"><span class="pl">'+(leaves!==null?'Leaves':'Off the tee')+'</span>'
  +'<span class="plv">'+(leaves!==null?leaves+' yd':'')+'</span></div><div class="body">'
  +'<div class="club">'+esc(rec[0])+'</div>'
  +'<div class="sub">'+rec[1]+' yards, spread about '+dispOf(rec[0])+' yards'
  +(leaves!==null?'. Leaves '+leaves+' yards in.':'')+'</div>';
 var notes=[];
 if(rec[0]!=="Driver")notes.push("<b>Driver spread is "+dispOf("Driver")+" yards</b> and this fairway plays about "+widthYd+". Hit the one that fits.");
 if(S.trouble==="left")notes.push("Trouble left. Start it at the right edge and let your pattern work back.");
 if(S.trouble==="right")notes.push("Trouble right. Start it at the left edge, but do not aim at the hazard and hope.");
 if(S.trouble==="both")notes.push("Both sides. Take the club that fits the gap, not the one that gets you closest.");
 if(leaves!==null&&leaves>0&&leaves<=125)notes.push("Leaves "+leaves+", a full wedge number. That is the tee shot.");
 else if(leaves!==null&&leaves>=125&&leaves<=175)notes.push("Leaves "+leaves+", which is your weak zone. Consider a club that leaves inside 125 or outside 175.");
 notes.push("275 in the fairway beats 300 in the trees. No hero shots.");
 notes.forEach(function(t){h+='<div class="note">'+t+'</div>'});
 h+='<table><tr><th>Club</th><th>Yds</th><th>Spread</th><th>Leaves</th></tr>'+rows+'</table>';
 h+='</div></div></div>';
 return h;
}
function tdig(n){if(S.hole.length<3)S.hole+=String(n);render()}

/* ================= CLUBS TAB ================= */
function clubsView(){
 var h='<div class="wrap"><div class="tiny" style="margin-top:22px">Carry distances. Edit these to match your Uneekor numbers.</div>';
 DEF.clubs.forEach(function(c){
  h+='<div class="crow"><span class="n">'+esc(c[0])+'</span>'
   +'<input type="text" inputmode="decimal" value="'+esc(DB.clubs[c[0]])+'" onchange="setClub(\''+c[0]+'\',this.value)">'
   +'<span class="u">yd</span></div>';
 });
 h+='<div class="stepper" style="margin-top:20px"><button onclick="setTemp(-5)">&minus;</button>'
  +'<div class="v">'+DB.temp+' &deg;F<small>playing temperature</small></div>'
  +'<button onclick="setTemp(5)">+</button></div>';
 h+='<div class="tiny" style="margin-top:26px">Wedge matrix</div><table>'
  +'<tr><th>Club</th><th>Full</th><th>3/4</th><th>Half</th></tr>';
 ["PW","GW","SW","LW"].forEach(function(n){
  var v=parseFloat(DB.clubs[n])||0;
  h+='<tr><td>'+n+'</td><td>'+Math.round(v)+'</td><td>'+Math.round(v*.85)+'</td><td>'+Math.round(v*.7)+'</td></tr>';
 });
 h+='</table><div class="note" style="margin-top:16px">Wedges inside 100 were flagged as one of your two biggest scoring leaks. '
  +'Know these three numbers per wedge and most of that leak closes.</div>';
 h+='<button class="chip" style="margin-top:22px;padding:16px" onclick="resetClubs()">Reset to starting numbers</button></div>';
 return h;
}
function setClub(n,v){var f=parseFloat(v);DB.clubs[n]=isNaN(f)?DB.clubs[n]:f;save(DB);render()}
function setTemp(d){DB.temp=Math.min(115,Math.max(35,DB.temp+d));save(DB);render()}
function resetClubs(){DEF.clubs.forEach(function(c){DB.clubs[c[0]]=c[1]});DB.temp=90;save(DB);render()}


function lieView(){
 var h='<div class="wrap"><div class="tiny" style="margin-top:22px">Read the lie before you pick a target</div>'
  +'<div class="note">Six questions, every shot, before the club comes out of the bag. Then grade it A through D. '
  +'The grade picks the target, the target picks the club. That order never changes.</div><ol>';
 READ5.forEach(function(q){h+='<li>'+esc(q)+'</li>'});
 h+='</ol>';
 h+='<div class="tiny" style="margin-top:24px">Grade it</div>';
 GRADES.forEach(function(g){
  h+='<div class="gradeRow"><div class="g">'+g[0]+'</div><div>'+esc(g[1])+'</div></div>';
 });
 h+='<div class="tiny" style="margin-top:28px">Every lie</div>';
 LIES.forEach(function(L){
  var open=S.openLie===L.id;
  h+='<button class="acc" onclick="S.openLie=\''+(open?"":L.id)+'\';render()">'
   +'<span class="gg">'+L.grade+'</span><span class="nn">'+esc(L.n)+'</span>'
   +'<span class="cv">'+(open?"&minus;":"+")+'</span></button>';
  if(open)h+=block(L.n,L);
 });
 h+='<div class="tiny" style="margin-top:28px">Slopes and stance</div>';
 SLOPES.forEach(function(L){
  if(L.id==="flat")return;
  var open=S.openLie==="s_"+L.id;
  h+='<button class="acc" onclick="S.openLie=\''+(open?"":"s_"+L.id)+'\';render()">'
   +'<span class="gg" style="background:#262626;color:#fff">&#9650;</span><span class="nn">'+esc(L.n)+'</span>'
   +'<span class="cv">'+(open?"&minus;":"+")+'</span></button>';
  if(open)h+=block(L.n,L);
 });
 h+='<div class="note" style="margin-top:24px"><b>Worst combinations.</b> Downhill lie in deep rough, plugged in a bunker with a high lip, '
  +'and ball below your feet off hardpan. All three are D lies no matter how good the number looks. Wedge out and move on.</div>';
 h+='</div>';
 return h;
}
/* ================= RULES TAB ================= */
function rulesView(){
 var h='<div class="wrap"><div class="tiny" style="margin-top:22px">Course management</div><ol>';
 RULES.forEach(function(r){h+='<li>'+esc(r)+'</li>'});
 h+='</ol><div class="tiny" style="margin-top:26px">Targets that actually move the handicap</div><div class="kpi">';
 KPI.forEach(function(k){h+='<div><b>'+esc(k[0])+'</b><span>'+esc(k[1])+'</span></div>'});
 h+='</div>';
 h+='<div class="tiny" style="margin-top:26px">Your pattern</div>'
  +'<div class="note">Driver: good contact <b>276</b>, typical window <b>267 to 287</b>, tee average <b>290</b>, '
  +'dispersion <b>41 yards</b> over 99 tracked drives. Centered pattern, no big one way miss anymore.</div>'
  +'<div class="note warn">When the swing gets quick, the handle pulls and the face closes early. That is the left miss. '
  +'Slow transition, let the hands drop, speed comes late.</div>'
  +'<div class="note warn">Distance is not the problem. The strokes are in approach play from 125 to 175, '
  +'wedges inside 100, and the occasional hero shot.</div>';
 h+='</div>';
 return h;
}

/* ================= SHELL ================= */
function render(){
 var t=S.tab;
 var head='<div class="top"><div class="toprow"><h1>Caddie</h1>'
  +'<div class="r">'+(t==="shot"?"Approach":t==="tee"?"Off the tee":t==="lie"?"Read and play it":t==="clubs"?"Your numbers":"Strategy")+'</div></div></div>';
 var body=t==="shot"?shotView():t==="tee"?teeView():t==="lie"?lieView():t==="clubs"?clubsView():rulesView();
 var tabs='<div class="tabs"><div class="tabrow">'
  +tab("shot","Shot")+tab("tee","Tee")+tab("lie","Lie")+tab("clubs","Clubs")+tab("rules","Rules")+'</div></div>';
 app.innerHTML=head+body+tabs;
}
function tab(k,l){return '<button class="tabb'+(S.tab===k?' on':'')+'" onclick="S.tab=\''+k+'\';render();window.scrollTo(0,0)">'+l+'</button>'}
render();
</script>
</body>
</html>
