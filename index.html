<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0a0a0a;color:#ffffff;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
 -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
h1,h2,h3,.big,.num,.nbtn,.start,.tiny,.toprow .t,.sp,.chip,.spec b,.rbtn,.swap{
 font-family:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",-apple-system,sans-serif}
h1,h2,h3,.big,.nbtn,.start,.rbtn{text-transform:uppercase;letter-spacing:.01em;font-weight:800}
.exhead h2,.card h2,.bhead h3,.wu h2{text-transform:uppercase}
input,textarea{font-family:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 170px}
.muted{color:#8a8a8a}
.tiny{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#8a8a8a;font-weight:700}
.section{margin-top:26px}

.hero{padding:26px 0 14px}
.hero h1{margin:6px 0 2px;font-size:34px;letter-spacing:0;font-weight:800}
.hero p{margin:0;font-size:16px;color:#8a8a8a}
.card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
 background:#141414;border:1px solid #262626;border-radius:20px;padding:20px;margin-bottom:14px}
.card:active{background:#1e1e1e}
.icon{flex:0 0 62px;height:62px;border-radius:16px;background:#0a0a0a;border:1px solid #333333;
 display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#ea0000}
.card h2{margin:0 0 4px;font-size:20px;font-weight:700;line-height:1.2}
.card .sub{font-size:14px;color:#8a8a8a}
.chev{margin-left:auto;font-size:26px;color:#555555}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
 background:rgba(234,0,0,.16);color:#ea0000;margin-left:8px;vertical-align:2px}
.badge.warm{background:rgba(234,0,0,.16);color:#ea0000}
.rules{background:#141414;border:1px solid #262626;border-radius:20px;padding:6px 20px;margin:22px 0 0}
.rules summary{padding:14px 0;font-weight:700;font-size:17px;list-style:none}
.rules summary::-webkit-details-marker{display:none}
.rules ol{margin:0 0 14px;padding-left:22px;line-height:1.75;color:#d6d6d6;font-size:16px}
.legend{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 16px}
.pill{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid #333333}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;
 padding:24px;z-index:60;backdrop-filter:blur(6px);overflow:auto}
.sheet .box{background:#141414;border:1px solid #333333;border-radius:24px;padding:26px;max-width:560px;width:100%}
.sheet h3{margin:0 0 6px;font-size:24px}
.sheet p{margin:0 0 20px;color:#8a8a8a;font-size:16px;line-height:1.5}
.rbtn{display:block;width:100%;padding:18px;border-radius:16px;font-size:19px;font-weight:700;margin-bottom:12px;
 border:1px solid #333333;background:#0a0a0a;text-align:left}
.rbtn span{display:block;font-size:14px;font-weight:500;color:#8a8a8a;margin-top:3px}
.rbtn.g{border-color:rgba(234,0,0,.7)} .rbtn.y{border-color:#d29922} .rbtn.r{border-color:#555555}

.top{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.95);backdrop-filter:blur(12px);
 padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;border-bottom:2px solid #ea0000}
.toprow{display:flex;align-items:center;gap:14px;max-width:820px;margin:0 auto}
.back{font-size:17px;font-weight:600;color:#ffffff;padding:6px 2px;white-space:nowrap}
.toprow .t{font-size:15px;font-weight:700;flex:1;text-align:center;color:#d6d6d6}
.toprow button.t{padding:8px 6px;border-radius:10px;line-height:1.25}
.toprow button.t:active{background:#141414}
.count{font-size:15px;font-weight:700;color:#8a8a8a;min-width:56px;text-align:right}
.bar{height:4px;background:#262626;border-radius:2px;margin:10px auto 0;max-width:820px;overflow:hidden}
.bar i{display:block;height:100%;background:#ea0000;border-radius:2px;transition:width .25s}

/* block list */
.block{background:#141414;border:1px solid #262626;border-radius:20px;padding:18px 20px;margin-bottom:14px}
.block.done{opacity:.55}
.bhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.bhead h3{margin:0;font-size:19px}
.bhead .meta{margin-left:auto;font-size:14px;color:#8a8a8a;font-weight:600}
.brow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #262626;font-size:17px}
.brow .r{margin-left:auto;color:#8a8a8a;font-size:15px;white-space:nowrap}
.swap{font-size:14px;font-weight:700;color:#ffffff;padding:6px 10px;border:1px solid #262626;border-radius:10px}
.start{width:100%;margin-top:14px;padding:17px;border-radius:16px;background:#ea0000;border:1px solid #ff2020;
 font-size:18px;font-weight:700}
.start.ghost{background:#0a0a0a;border-color:#333333;color:#8a8a8a}

/* run screen */
.strip{display:flex;gap:8px;margin:18px 0 4px;flex-wrap:wrap}
.sp{flex:1;min-width:110px;padding:11px 12px;border-radius:14px;background:#141414;border:1px solid #262626;
 font-size:14px;font-weight:700;color:#8a8a8a;text-align:center;line-height:1.25}
.sp.on{background:rgba(234,0,0,.16);border-color:#ea0000;color:#ffffff}
.sp.ok{color:#ea0000}
.exhead{padding:14px 0 4px}
.exhead .kicker{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ea0000}
.exhead h2{margin:8px 0 10px;font-size:36px;line-height:1.08;letter-spacing:0}
.specs{display:flex;gap:10px;flex-wrap:wrap}
.spec{background:#141414;border:1px solid #262626;border-radius:12px;padding:9px 13px;font-size:15px}
.spec b{color:#ffffff}
.cue{margin:14px 0 0;padding:14px 16px;background:rgba(234,0,0,.07);border-left:3px solid #ffffff;
 border-radius:0 12px 12px 0;font-size:17px;line-height:1.45;color:#d6d6d6}
.wrow{display:flex;gap:12px;margin-top:12px}
.wbtn{flex:0 0 84px;background:#141414;border:1px solid #333333;border-radius:18px;font-size:32px;font-weight:300}
.wbtn:active{background:#1e1e1e}
.wval{flex:1;background:#141414;border:1px solid #333333;border-radius:18px;text-align:center;font-size:30px;
 font-weight:700;color:#ffffff;padding:18px 6px;min-width:0}
.hint{margin-top:8px;font-size:14px;color:#8a8a8a}
.chips{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.chip{flex:1;min-width:60px;padding:16px 0;border-radius:16px;background:#141414;border:1px solid #333333;
 font-size:19px;font-weight:700;text-align:center}
.chip.on{background:rgba(234,0,0,.16);border-color:#ea0000;color:#ea0000}
textarea{width:100%;margin-top:12px;background:#141414;border:1px solid #333333;border-radius:16px;color:#ffffff;
 font-size:17px;padding:16px;min-height:80px;resize:none}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,10,.97);backdrop-filter:blur(12px);
 border-top:1px solid #262626;padding:12px 18px calc(env(safe-area-inset-bottom) + 12px)}
.navrow{display:flex;gap:12px;max-width:820px;margin:0 auto}
.nbtn{flex:1;padding:20px 0;border-radius:18px;background:#141414;border:1px solid #333333;font-size:18px;
 font-weight:700;text-align:center}
.nbtn.primary{background:#ea0000;border-color:#ff2020;flex:2}
.nbtn.primary small{display:block;font-size:13px;font-weight:600;opacity:.8;margin-top:3px}
.nbtn:disabled{opacity:.35}

.timer{position:fixed;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:40;max-width:820px;
 margin:0 auto;background:#160000;border:1px solid #ea0000;border-radius:20px;padding:16px 20px;display:flex;
 align-items:center;gap:16px;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.timer .lab{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#ea0000}
.timer .num{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;color:#ffffff;line-height:1}
.timer .acts{margin-left:auto;display:flex;gap:10px}
.timer .acts button{padding:12px 16px;border-radius:14px;border:1px solid #ea0000;font-size:16px;font-weight:800;color:#ffffff;text-transform:uppercase}

/* warm up */
.wu{text-align:center;padding:30px 0 0}
.wu .num{font-size:104px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-4px}
.wu h2{font-size:34px;margin:18px 0 6px;line-height:1.15}
.wu .cue2{font-size:18px;color:#8a8a8a;line-height:1.5;max-width:560px;margin:0 auto}
.ring{width:100%;height:6px;background:#262626;border-radius:3px;margin-top:26px;overflow:hidden}
.ring i{display:block;height:100%;background:#ea0000;transition:width 1s linear}
.wulist{margin-top:30px}
.wulist div{display:flex;gap:12px;padding:12px 0;border-top:1px solid #262626;font-size:16px;color:#8a8a8a}
.wulist div.on{color:#ffffff;font-weight:700}
.wulist div span{margin-left:auto}

.sum{background:#141414;border:1px solid #262626;border-radius:20px;padding:20px;margin-top:16px}
.sum table{width:100%;border-collapse:collapse;font-size:16px}
.sum td{padding:11px 0;border-bottom:1px solid #262626}
.sum td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.sum tr:last-child td{border-bottom:none}
.big{font-size:56px;font-weight:800;letter-spacing:0;margin:18px 0 2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer"></div>
<script>
/* ==================== PROGRAM ==================== */
var PROGRAM=[
{id:"d1",title:"Lower Body Power + Rotation",time:"35 to 45 min",
 ex:[
  {n:"Cable Squat to Press",s:3,r:"5",tempo:"Explosive",w:40,wu:"lb",cue:"Move fast. Stand, then press."},
  {n:"Vertical Jump",s:3,r:"5",tempo:"Explosive",w:0,wu:"bodyweight",cue:"Max height. Reset each rep."},
  {n:"DB Romanian Deadlift",s:3,r:"8",tempo:"3-0-1-0",w:40,wu:"lb DBs",cue:"Hinge. Keep the weights close."},
  {n:"Cable Rotational Press",s:3,r:"8 / side",tempo:"Controlled",w:30,wu:"lb",cue:"Turn hips and torso together."},
  {n:"Bulgarian Split Squat",s:3,r:"8 / leg",tempo:"2-0-1-0",w:25,wu:"lb DBs",cue:"Front foot pressure. Tall posture."},
  {n:"Low-to-High Cable Lift",s:3,r:"10 / side",tempo:"Controlled",w:25,wu:"lb",cue:"Drive up and across the body."},
  {n:"Hamstring Curl",s:2,r:"12",tempo:"2-1-2-0",w:70,wu:"lb",cue:"Control the curl down."},
  {n:"Pallof Press Hold",s:3,r:"20 sec / side",tempo:"Hold",w:25,wu:"lb",cue:"Do not let the torso rotate."}
 ],
 blocks:[{n:"A",tag:"Power",rest:60,ex:[0,1]},{n:"B",tag:"Strength",rest:45,ex:[2,3,4]},{n:"C",tag:"Rotation + finish",rest:45,ex:[5,6,7]}]},

{id:"d2",title:"Upper Body Speed + Stability",time:"35 to 45 min",
 ex:[
  {n:"Explosive Cable Chest Press",s:3,r:"5",tempo:"Explosive",w:30,wu:"lb",cue:"Punch fast. Ribs down."},
  {n:"Explosive Cable Row",s:3,r:"5",tempo:"Explosive",w:40,wu:"lb",cue:"Pull fast. Control the return."},
  {n:"Single Arm Cable Press",s:3,r:"8 / side",tempo:"2-0-1-0",w:25,wu:"lb",cue:"Stay square. Press strong."},
  {n:"Single Arm Cable Row",s:3,r:"8 / side",tempo:"2-0-1-0",w:35,wu:"lb",cue:"Elbow to pocket."},
  {n:"Pallof Walkout",s:3,r:"8 / side",tempo:"Controlled",w:20,wu:"lb",cue:"Brace, step out slowly."},
  {n:"Half-Kneeling Pulldown",s:3,r:"10 / side",tempo:"2-1-1-0",w:40,wu:"lb",cue:"Glute squeezed. Rib cage down."},
  {n:"Face Pull",s:3,r:"15",tempo:"2-1-2-0",w:25,wu:"lb",cue:"Pull to eye line."},
  {n:"Cable Y Raise",s:2,r:"12",tempo:"Controlled",w:10,wu:"lb",cue:"Light load. Clean pattern."}
 ],
 blocks:[{n:"A",tag:"Power",rest:60,ex:[0,1]},{n:"B",tag:"Strength",rest:45,ex:[2,3,4]},{n:"C",tag:"Shoulders + finish",rest:45,ex:[5,6,7]}]},

{id:"d3",title:"Athletic Strength + Conditioning",time:"35 to 45 min",
 ex:[
  {n:"Goblet Squat",s:4,r:"10",tempo:"2-0-1-0",w:50,wu:"lb DB",cue:"Smooth reps. No grind."},
  {n:"Cable Chop",s:4,r:"10 / side",tempo:"Controlled",w:25,wu:"lb",cue:"Hips lead, ribs follow."},
  {n:"Reverse Lunge",s:4,r:"8 / leg",tempo:"2-0-1-0",w:25,wu:"lb DBs",cue:"Step back. Drive through the front heel."},
  {n:"Standing Cable Row",s:4,r:"12",tempo:"2-1-1-0",w:45,wu:"lb",cue:"Tall posture."},
  {n:"Cable Press",s:4,r:"12",tempo:"2-0-1-0",w:35,wu:"lb",cue:"Brace. Finish long."},
  {n:"Single-Leg RDL",s:4,r:"8 / leg",tempo:"Controlled",w:25,wu:"lb DB",cue:"Hips square. Soft knee."},
  {n:"Farmer Carry",s:4,r:"40 to 60 steps",tempo:"Steady",w:60,wu:"lb DBs",cue:"Tall walk. Quiet ribs."},
  {n:"Leg Extension",s:2,r:"12",tempo:"2-1-2-0",w:80,wu:"lb",cue:"Control the top squeeze."},
  {n:"Leg Curl",s:2,r:"12",tempo:"2-1-2-0",w:70,wu:"lb",cue:"Hamstring finish."}
 ],
 blocks:[{n:"A",tag:"Circuit",rest:45,ex:[0,1,2]},{n:"B",tag:"Circuit",rest:45,ex:[3,4,5]},{n:"C",tag:"Carry + legs",rest:45,ex:[6,7,8]}]},

{id:"d4",title:"Speed + Recovery",time:"20 to 30 min",
 ex:[
  {n:"Cable Rotations",s:3,r:"8 / side",tempo:"Fast",w:25,wu:"lb",cue:"Light and quick."},
  {n:"Step-Behind Rotations",s:3,r:"6 / side",tempo:"Fast",w:20,wu:"lb",cue:"Sequence feet, then hips, then torso."},
  {n:"Face Pull",s:2,r:"15",tempo:"Controlled",w:20,wu:"lb",cue:"Clean shoulder blades."},
  {n:"Band Pull Apart",s:2,r:"20",tempo:"Controlled",w:0,wu:"band",cue:"Wide chest."},
  {n:"90/90 Hip Flow",s:2,r:"5 / side",tempo:"Flow",w:0,wu:"bodyweight",cue:"Move slowly."},
  {n:"Walk / Easy Circuit",s:1,r:"10 min",tempo:"Easy",w:0,wu:"easy",cue:"Nasal breathing pace."}
 ],
 blocks:[{n:"A",tag:"Speed",rest:45,ex:[0,1]},{n:"B",tag:"Recovery",rest:30,ex:[2,3,4]},{n:"C",tag:"Easy",rest:0,ex:[5]}]},
{id:"d5",title:"Mobility + Recovery",time:"25 to 30 min",
 ex:[
  {n:"90/90 Hip Switches",s:2,r:"8 / side",tempo:"Slow",w:0,wu:"bodyweight",cue:"Sit tall, switch side to side. Hands off the floor if you can."},
  {n:"Half-Kneeling Hip Flexor",s:2,r:"45 sec / side",tempo:"Hold",w:0,wu:"bodyweight",cue:"Tuck the pelvis under first, then reach over the top. No arching."},
  {n:"Adductor Rock Back",s:2,r:"10 / side",tempo:"Slow",w:0,wu:"bodyweight",cue:"Long leg straight, flat back, rock the hips back until it bites."},
  {n:"Figure 4 Hip Stretch",s:2,r:"45 sec / side",tempo:"Hold",w:0,wu:"bodyweight",cue:"Ankle over the knee, chest tall, breathe into the back of the hip."},
  {n:"Open Book Rotation",s:2,r:"8 / side",tempo:"Slow",w:0,wu:"bodyweight",cue:"Side lying, knees stacked and quiet. Follow the top hand with your eyes."},
  {n:"Quadruped T-Spine Rotation",s:2,r:"8 / side",tempo:"Slow",w:0,wu:"bodyweight",cue:"Hand behind the head, hips locked. Turn from the mid back, not the low back."},
  {n:"Cat / Camel",s:2,r:"8",tempo:"Flow",w:0,wu:"bodyweight",cue:"Move segment by segment. Breathe out at the top of the round."},
  {n:"Seated Trunk Rotation",s:2,r:"10 / side",tempo:"Slow",w:0,wu:"club across shoulders",cue:"Knees pinned, lower body quiet. Turn against it and feel the mid back work."},
  {n:"Shoulder Pass-Throughs",s:2,r:"10",tempo:"Slow",w:0,wu:"club or band",cue:"Wide grip, slow, no shrugging. Narrow the grip only if it stays smooth."},
  {n:"Wall Angels",s:2,r:"10",tempo:"Slow",w:0,wu:"bodyweight",cue:"Low back flat to the wall, wrists stay in contact. Small range done right beats big and sloppy."},
  {n:"Standing Hamstring Sweep",s:2,r:"10 / side",tempo:"Slow",w:0,wu:"bodyweight",cue:"Flat back hinge, sweep the toe up. Back stays long the whole time."},
  {n:"Ankle Wall Dorsiflexion",s:2,r:"10 / side",tempo:"Slow",w:0,wu:"bodyweight",cue:"Knee tracks over the toe, heel glued down. This is where the downswing gets its ground."},
  {n:"Deep Squat Hold",s:1,r:"60 sec",tempo:"Hold",w:0,wu:"bodyweight",cue:"Sit in the bottom, elbows pry the knees out, chest up. Breathe."},
  {n:"Breathing Reset",s:1,r:"2 min",tempo:"Easy",w:0,wu:"feet up on a bench",cue:"Five seconds in through the nose, seven out. Ribs down. This is the part that resets the nervous system."}
 ],
 blocks:[{n:"A",tag:"Hips",rest:20,ex:[0,1,2,3]},{n:"B",tag:"Spine and ribs",rest:20,ex:[4,5,6,7]},
         {n:"C",tag:"Shoulders, hams, ankles",rest:20,ex:[8,9,10,11]},{n:"D",tag:"Finish",rest:0,ex:[12,13]}]}
];

var WARMUP=[
 {n:"Cat / Camel",t:40,cue:"On all fours. Round the back, then open the chest. Breathe out at the top."},
 {n:"90/90 Hip Switches",t:60,cue:"Sit tall, drop the knees side to side. Chest stays proud, hands off the floor if you can."},
 {n:"World's Greatest Stretch",t:60,cue:"Long lunge, elbow toward the instep, then reach up and turn. Alternate sides."},
 {n:"Open Book Rotation",t:45,cue:"Side lying, knees stacked, top hand opens across. Follow your hand with your eyes."},
 {n:"Leg Swings",t:60,cue:"Front to back, then side to side. Hold something, stay tall, let them get bigger."},
 {n:"Trunk Rotations with a Club",t:45,cue:"Club across the shoulders. Turn against a quiet lower body, both directions."},
 {n:"Shoulder Pass-Throughs",t:30,cue:"Wide grip on a club or band. Slow, no shrugging."},
 {n:"Squat to Reach",t:40,cue:"Squat down, reach one arm tall, open the chest. Alternate sides."},
 {n:"Ramp-Up Swings",t:45,cue:"Half speed, three quarter, then full. No ball. This is the switch that turns speed on."}
];
var RULES=["Move fast on power exercises.","Stop each set with 2 reps left.","No soreness that affects golf.",
 "Warm up every session.","Use Yellow or Red days when stiff.","Log Uneekor speed after training."];

/* ==================== STORAGE ==================== */
var KEY="ogt-v3",mem={};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return mem}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){mem=o}}
var DB=load(); if(!DB.weights)DB.weights={}; if(!DB.history)DB.history={};
function saveLive(){
 try{
  if(!S.sess){DB.live=null;save(DB);return}
  DB.live={day:S.day,readiness:S.readiness,all:S.all,bmap:S.bmap,bi:S.bi,round:S.round,pos:S.pos,
   view:(S.view==="run"||S.view==="day")?S.view:"day",date:todayStr(),at:new Date().getTime()};
  save(DB);
 }catch(e){}
}
function liveSets(){
 var n=0;try{for(var id in DB.live.all){var ss=DB.live.all[id].sets;
  for(var k in ss){var a=ss[k];for(var i=0;i<a.length;i++)if(a[i])n++}}}catch(e){}
 return n;
}
function resumeLive(){
 var L=DB.live;if(!L)return;
 S.all=L.all||{};S.bmap=L.bmap||{};S.day=L.day||0;S.readiness=L.readiness||"GREEN";
 var id=PROGRAM[S.day].id;
 S.sess=S.all[id]||{sets:{},w:{},rpe:{},note:{},started:new Date().getTime()};
 S.blocks=S.bmap[id]||JSON.parse(JSON.stringify(PROGRAM[S.day].blocks));
 S.bi=L.bi||0;S.round=L.round||0;S.pos=L.pos||0;
 if(L.view==="run"){S.view="run";render()}else{dayView()}
}
function dropLive(){DB.live=null;save(DB);S.sess=null;S.all={};S.bmap={};home()}

/* ==================== AUDIO ==================== */
var actx=null;
function unlock(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(actx&&actx.state==="suspended")actx.resume();}
document.addEventListener("touchstart",unlock);document.addEventListener("click",unlock);
function beep(times,hz){if(!actx)return;var t=actx.currentTime;

  o.frequency.value=hz||880;o.type="sine";g.gain.setValueAtTime(0,t+i*.28);g.gain.linearRampToValueAtTime(.4,t+i*.28+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+i*.28+.22);o.start(t+i*.28);o.stop(t+i*.28+.25);}}

/* ==================== RUN A BLOCK ==================== */
function activeIn(b,round){var a=[];b.ex.forEach(function(i,p){if(setsFor(i)>round)a.push(p)});return a}
function runBlock(bi){
 S.bi=bi;var b=S.blocks[bi];
 if(blockDone(b)){b.ex.forEach(function(i){S.sess.sets[i]=[]})}
 var r=0;while(r<rounds(b)&&activeIn(b,r).every(function(p){return(S.sess.sets[b.ex[p]]||[])[r]}))r++;
 if(r>=rounds(b))r=0;
 S.round=r;var act=activeIn(b,r);
 S.pos=act.length?act[0]:0;
 for(var k=0;k<act.length;k++){if(!(S.sess.sets[b.ex[act[k]]]||[])[r]){S.pos=act[k];break}}
 S.view="run";render();
}
function nextUp(){
 var b=S.blocks[S.bi],act=activeIn(b,S.round);
 var idx=act.indexOf(S.pos);
 for(var k=idx+1;k<act.length;k++){if(!(S.sess.sets[b.ex[act[k]]]||[])[S.round])return{pos:act[k],round:S.round,rest:false}}
 for(var k=0;k<idx;k++){if(!(S.sess.sets[b.ex[act[k]]]||[])[S.round])return{pos:act[k],round:S.round,rest:false}}
 var nr=S.round+1;
 while(nr<rounds(b)){var a2=activeIn(b,nr);
  for(var k=0;k<a2.length;k++){if(!(S.sess.sets[b.ex[a2[k]]]||[])[nr])return{pos:a2[k],round:nr,rest:true}}
  nr++;}
 return null;
}
function doneSet(){
 var b=S.blocks[S.bi],i=b.ex[S.pos];
 if(!S.sess.sets[i])S.sess.sets[i]=[];
 S.sess.sets[i][S.round]=true;
 var k=EX(i).n; if(S.sess.w[k]!==undefined){DB.weights[k]=S.sess.w[k];save(DB)}
 var nx=nextUp();
 if(!nx){beep(3,660);blockDoneView();return}
 S.pos=nx.pos;S.round=nx.round;
 if(nx.rest&&b.rest>0)startTimer(b.rest,"round");else stopTimer();
 render();
}
function skipTo(p){S.pos=p;render()}

 if(S.view==="home")return home();

 var d=D(),tot=0,got=0;d.ex.forEach(function(x,ii){tot+=setsFor(ii);got+=doneSets(ii)});
 var nx=nextUp(),loaded=e.w>0||DB.weights[e.n]>0;
 var h='<div class="top"><div class="toprow"><button class="back" onclick="dayView()">&lsaquo; Blocks</button>'
  +'<button class="t sw" onclick="openDayPicker()">DAY '+(S.day+1)+' &middot; BLOCK '+b.n+' &middot; ROUND '+(S.round+1)+' OF '+R+' &#9662;</button>'
  +'<div class="count">'+got+' / '+tot+'</div></div>'
  +'<div class="bar"><i style="width:'+(tot?got/tot*100:0)+'%"></i></div></div><div class="wrap">';
 h+='<div class="strip">';
 b.ex.forEach(function(xi,p){
  var did=(S.sess.sets[xi]||[])[S.round],off=setsFor(xi)<=S.round;
  h+='<button class="sp'+(p===S.pos?' on':'')+(did?' ok':'')+'" onclick="skipTo('+p+')">'
   +(did?'&#10003; ':'')+esc(EX(xi).n)+(off?'<br><span style="font-size:12px">done</span>':'')+'</button>';
 });
 h+='</div>';
 h+='<div class="exhead"><div class="kicker">Set '+(S.round+1)+' of '+setsFor(i)
  +(S.readiness==="YELLOW"?' &middot; reduced volume':'')+'</div><h2>'+esc(e.n)+'</h2><div class="specs">'
  +'<div class="spec"><b>'+esc(e.r)+'</b> reps</div><div class="spec">tempo <b>'+esc(e.tempo)+'</b></div>'

 if(loaded){

   +'<button class="wbtn" onclick="bump(5)">+</button></div><div class="hint">'+esc(e.wu)
   +(DB.weights[e.n]!==undefined?' &middot; last time '+esc(DB.weights[e.n]):' &middot; program start '+e.w)+'</div></div>';
 }
 h+='<div class="section"><div class="tiny">Effort (optional)</div><div class="chips">';
 [6,7,8,9,10].forEach(function(v){h+='<button class="chip'+(S.sess.rpe[i]===v?' on':'')+'" onclick="setRpe('+v+')">'+v+'</button>'});
 h+='</div></div>';
 h+='<div class="section"><div class="tiny">Note</div><textarea placeholder="Anything worth remembering" '
  +'oninput="S.sess.note['+i+']=this.value;saveLive()">'+esc(S.sess.note[i]||'')+'</textarea></div></div>';
 var lab=nx?(nx.rest?'Round '+(nx.round+1)+': '+EX(b.ex[nx.pos]).n:'Next: '+EX(b.ex[nx.pos]).n):'Block complete';

  +'<button class="nbtn" onclick="dayView()">Blocks</button>'
  +'<button class="nbtn primary" onclick="doneSet()">Set done<small>'+esc(lab)+'</small></button></div></div>';
 app.innerHTML=h;window.scrollTo(0,0);drawTimer();saveLive();
}
function bump(dv){var b=S.blocks[S.bi],i=b.ex[S.pos],k=EX(i).n,v=parseFloat(wOf(i));

function setW(v){var b=S.blocks[S.bi],i=b.ex[S.pos],k=EX(i).n,f=parseFloat(v);

/* ==================== WARM UP ==================== */
var wTimer=null;

 }

function warmDone(){

  +'<div style="font-size:56px;line-height:1">&#10003;</div><h3 style="margin-top:10px">Warm. Go train.</h3>'
  +'<p>Hips, spine and shoulders are open. Move fast today.</p>'

}

/* ==================== SUMMARY ==================== */
function summary(){
 stopTimer();if(wTimer){clearInterval(wTimer);wTimer=null}
 var d=D(),rows="",sets=0,vol=0,lines=[];
 d.ex.forEach(function(e,i){
  var ds=doneSets(i),ns=setsFor(i);if(ds===0&&ns===0)return;sets+=ds;
  var w=parseFloat(wOf(i));if(!isNaN(w))vol+=w*ds;
  if(ds>0){
   rows+='<tr><td>'+esc(e.n)+'</td><td>'+ds+'/'+ns+(!isNaN(w)&&w>0?' @ '+w:'')
    +(S.sess.rpe[i]?' &middot; RPE '+S.sess.rpe[i]:'')+'</td></tr>';
   lines.push(e.n+": "+ds+"/"+ns+(!isNaN(w)&&w>0?" @ "+w+" "+e.wu:"")
    +(S.sess.rpe[i]?", RPE "+S.sess.rpe[i]:"")+(S.sess.note[i]?" ("+S.sess.note[i]+")":""));}
 });
 var mins=Math.max(1,Math.round((Date.now()-S.sess.started)/60000));
 for(var k in S.sess.w)DB.weights[k]=S.sess.w[k];
 DB.history[d.id]=todayStr();DB.live=null;save(DB);
 window.__txt="Day "+(S.day+1)+" "+d.title+", "+todayStr()+", "+mins+" min, "+S.readiness+"\n"+lines.join("\n");
 app.innerHTML='<div class="top"><div class="toprow"><button class="back" onclick="dayView()">&lsaquo; Back</button>'
  +'<div class="t">SESSION COMPLETE</div><div class="count"></div></div></div><div class="wrap">'
  +'<div class="big">'+sets+' sets</div><div class="muted" style="font-size:17px">Day '+(S.day+1)+' &middot; '+mins
  +' min &middot; '+todayStr()+(vol>0?' &middot; '+Math.round(vol)+' lb moved':'')+'</div>'
  +'<div class="sum"><table>'+(rows||'<tr><td class="muted">Nothing logged</td><td></td></tr>')+'</table></div>'
  +'<div class="section"><div class="tiny">Uneekor after training</div>'
  +'<textarea id="lm" placeholder="Club speed, ball speed, smash, contact"></textarea></div></div>'
  +'<div class="nav"><div class="navrow"><button class="nbtn" onclick="copyLog()">Copy log</button>'
  +'<button class="nbtn primary" onclick="S.sess=null;home()">Done</button></div></div>';
 window.scrollTo(0,0);tEl.innerHTML="";
}
function copyLog(){
 var lm=document.getElementById("lm"),t=window.__txt+(lm&&lm.value?"\nUneekor: "+lm.value:"");
 var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity=0;
 document.body.appendChild(ta);ta.focus();ta.select();
 try{document.execCommand("copy")}catch(e){}
 if(navigator.clipboard){try{navigator.clipboard.writeText(t)}catch(e){}}
 document.body.removeChild(ta);alert("Session copied. Paste it wherever you want it.");
}
home();
</script>
